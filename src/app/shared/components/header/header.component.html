<header class="header" [class.header--scrolled]="isScrolled()">
  <div class="header__container">
    <a routerLink="/" class="header__logo" (click)="closeMobileMenu()">
      <span class="header__logo-icon">⚽</span>
      <div class="header__logo-text">
        <span class="header__logo-title">FIFA</span>
        <span class="header__logo-subtitle">World Cup Stats</span>
      </div>
    </a>

    <nav class="header__nav" [class.header__nav--open]="isMobileMenuOpen()">
      <ul class="header__nav-list">
        @for (link of navLinks; track link.path) {
          <li class="header__nav-item">
            <a
              [routerLink]="link.path"
              routerLinkActive="header__nav-link--active"
              [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
              class="header__nav-link"
              (click)="closeMobileMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      class="header__menu-btn"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span class="header__menu-bar" [class.header__menu-bar--open]="isMobileMenuOpen()"></span>
    </button>
  </div>
</header>
